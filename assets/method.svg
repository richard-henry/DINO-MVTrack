<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="440" viewBox="0 0 1120 440" role="img" aria-labelledby="title desc"><title id="title">DINO-MVTrack method</title><desc id="desc">Multi-view RGB inputs feed frozen DINO and adapted tracking features. Pseudo tracks initialize and supervise 3D refinement through calibrated projection.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#7791b6"/></marker><style>text{font-family:Arial,sans-serif;fill:#14243b}.title{font-size:18px;font-weight:600}.small{font-size:13px;fill:#56677c}.label{font-size:11px;fill:#2759d4;font-weight:600;letter-spacing:1px}.line{fill:none;stroke:#7791b6;stroke-width:2;marker-end:url(#arrow)}.box{fill:#f6f9fd;stroke:#dce4ee;stroke-width:1.5}</style></defs><rect width="1120" height="440" fill="white"/><text x="32" y="35" class="label">INPUTS</text><text x="270" y="35" class="label">COMPLEMENTARY FEATURES</text><text x="588" y="35" class="label">GEOMETRIC REFINEMENT</text><text x="918" y="35" class="label">OUTPUT</text><rect class="box" x="32" y="100" width="184" height="164" rx="9"/><g fill="#c7d9ee" stroke="#789ac5"><rect x="58" y="132" width="52" height="35" rx="3"/><rect x="119" y="132" width="52" height="35" rx="3"/><rect x="58" y="176" width="52" height="35" rx="3"/><rect x="119" y="176" width="52" height="35" rx="3"/></g><text x="54" y="240" class="title">Multi-view RGB</text><text x="41" y="286" class="small">Calibration + task queries</text><rect class="box" x="270" y="72" width="230" height="75" rx="9"/><text x="290" y="104" class="title">DINOv3-S features</text><text x="290" y="128" class="small">Frozen semantic backbone</text><rect x="270" y="178" width="230" height="75" rx="9" fill="#edf3ff" stroke="#aac4ef"/><text x="290" y="210" class="title">Tracker features</text><text x="290" y="234" class="small">Scene-adapted encoder + fusion</text><path class="line" d="M216 168H239V110H266"/><path class="line" d="M216 190H239V216H266"/><rect class="box" x="586" y="72" width="268" height="181" rx="9"/><text x="608" y="104" class="title">Local 3D candidate search</text><g stroke="#86a6d4" fill="none"><path d="m630 137 46-18 48 20-46 21Zm0 0v54l48 23 46-20v-55M678 160v54M646 131v68M662 125v80M694 126v81M710 133v67M630 155l48 22 46-21M630 173l48 22 46-20"/></g><text x="743" y="154" class="small">7 × 7 × 7</text><text x="743" y="176" class="small">candidates</text><text x="608" y="236" class="small">Project → sample → fuse → refine · ×8</text><path class="line" d="M500 110H582"/><path class="line" d="M500 216H582"/><rect x="914" y="100" width="175" height="153" rx="9" fill="#eef8f5" stroke="#b6d9d0"/><g fill="none" stroke-width="3"><path d="M935 166q22-48 49-13t42 13 40-33" stroke="#329eaf"/><path d="M935 186q27-25 48-9t37-1 46 23" stroke="#597bd4"/><path d="M935 146q20 39 47 30t43-37 41 24" stroke="#d48967"/></g><text x="934" y="226" class="title">3D trajectories</text><path class="line" d="M854 168H910"/><rect x="270" y="323" width="230" height="76" rx="9" fill="#fff7e9" stroke="#e4ceaa"/><text x="290" y="354" class="title">2D pseudo tracks</text><text x="290" y="379" class="small">Teacher predictions; no GT loss</text><path class="line" d="M126 267V361H266"/><path class="line" d="M500 345H555V276H654V257"/><text x="570" y="297" class="small">Triangulated initialization</text><path d="M1002 258V361H506" fill="none" stroke="#b89356" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><rect x="624" y="345" width="241" height="31" fill="white"/><text x="630" y="365" class="small">2D projection → pseudo-track loss</text><text x="32" y="426" class="small">Scene optimization updates tracker features / fusion. Camera calibration, the teacher and the DINO backbone stay fixed.</text></svg>
